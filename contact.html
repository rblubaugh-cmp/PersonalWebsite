    <!-------------------------CONTACT ME---------------------->
    <div class="contactMe">
      <div class="formContainer">
        <div class="contactL">
          <h1>Contact Me</h1>
          <p>
            Do you want to work with me on your next design or project?
            <br />Fill out the form below and lets get to work!
          </p>
          <form action="submit.html">
            <div class="formBox">
              <label for="Name"></label>
              <input type="text" name="fullname" placeholder="Name" required />
            </div>
            <div class="formBox">
              <label for="Email"></label>
              <input type="text" name="email" placeholder="Email" required />
            </div>
            <div class="formBox">
              <label for="Message"></label>
              <textarea
                id="formMessage"
                type="text"
                name="message"
                placeholder="What would you like to work on?"
                required
              ></textarea>
            </div>
            <button type="submit" class="subButton">Lets Work!</button>
          </form>
        </div>
      </div>
      <img src="img/monarussell.jpg" alt="The Beautiful Mona Russell" />
    </div>
